version: '3.8'

services:
  # ── Self-Hosted MongoDB for Development (Zero Cost) ────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: litmus_dev_mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-litmusadmin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-litmusdevpassword123}
      - MONGO_INITDB_DATABASE=litmus_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - litmus_dev_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis In-Memory Store for Dev ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: litmus_dev_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - litmus_dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Litmus Backend Service (Dev Mode / Hot-Reload or Production Build) ─────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litmus_dev_backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-litmusadmin}:${MONGO_INITDB_ROOT_PASSWORD:-litmusdevpassword123}@mongodb:27017/litmus_dev?authSource=admin
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    networks:
      - litmus_dev_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  mongo_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  litmus_dev_network:
    driver: bridge
