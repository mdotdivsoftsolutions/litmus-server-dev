# ==============================================================================
# 🛠️ Litmus Development Nginx Configuration
# ==============================================================================
# Domain Topology:
#   - api.dev.litmuslabs.in   -> Dev Backend API (http://127.0.0.1:5000)
#   - app.dev.litmuslabs.in   -> Dev User App    (http://127.0.0.1:3000)
#   - admin.dev.litmuslabs.in -> Dev Admin SPA   (/var/www/litmus-dev/admin/dist)
#   - lab.dev.litmuslabs.in   -> Dev Lab SPA     (/var/www/litmus-dev/lab/dist)
# ==============================================================================

# ── 1. Dev Backend API & WebSockets ──────────────────────────────────────────
server {
    listen 80;
    server_name api.dev.litmuslabs.in;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 2. Dev User Frontend (Next.js) ───────────────────────────────────────────
server {
    listen 80;
    server_name app.dev.litmuslabs.in;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── 3. Dev Admin Frontend (Vite SPA) ─────────────────────────────────────────
server {
    listen 80;
    server_name admin.dev.litmuslabs.in;

    root /var/www/litmus-dev/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── 4. Dev Lab Partner Frontend (Vite SPA) ───────────────────────────────────
server {
    listen 80;
    server_name lab.dev.litmuslabs.in;

    root /var/www/litmus-dev/lab/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
