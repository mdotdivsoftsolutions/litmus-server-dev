# ==============================================================================
# 🌐 Litmus Production Nginx Configuration
# ==============================================================================
# Domain Topology:
#   - api.litmuslabs.in    -> Node.js API & Socket.IO (http://127.0.0.1:5000)
#   - litmuslabs.in / www  -> Next.js User Portal     (http://127.0.0.1:3000)
#   - admin.litmuslabs.in  -> Admin Dashboard SPA     (/var/www/litmus/admin/dist)
#   - lab.litmuslabs.in    -> Lab Partner Portal SPA  (/var/www/litmus/lab/dist)
# ==============================================================================

# ── Global Gzip Settings ──────────────────────────────────────────────────────
gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  application/json
  application/javascript
  application/x-javascript
  text/xml
  application/xml
  application/xml+rss
  text/javascript
  image/svg+xml;

# ── Rate Limiting Zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# ==============================================================================
# 1. Litmus Backend API & WebSockets (api.litmuslabs.in)
# ==============================================================================
server {
    listen 80;
    server_name api.litmuslabs.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.litmuslabs.in;

    ssl_certificate /etc/letsencrypt/live/api.litmuslabs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.litmuslabs.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 60M;

    # Rate limiting on authentication routes
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standard REST API routes
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Persistent WebSockets (Socket.IO)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ==============================================================================
# 2. Litmus User Frontend - Next.js (litmuslabs.in & www.litmuslabs.in)
# ==============================================================================
server {
    listen 80;
    server_name litmuslabs.in www.litmuslabs.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name litmuslabs.in www.litmuslabs.in;

    ssl_certificate /etc/letsencrypt/live/litmuslabs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/litmuslabs.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# 3. Litmus Admin Frontend - Vite SPA (admin.litmuslabs.in)
# ==============================================================================
server {
    listen 80;
    server_name admin.litmuslabs.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.litmuslabs.in;

    ssl_certificate /etc/letsencrypt/live/admin.litmuslabs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.litmuslabs.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/litmus/admin/dist;
    index index.html;

    # Static assets caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA Fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

