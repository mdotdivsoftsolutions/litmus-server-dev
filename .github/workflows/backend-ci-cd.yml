name: 🚀 Backend CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # STAGE 1: Continuous Integration (Lint & Test)
  # ==========================================
  test:
    name: 🧪 Run Lints & Vitest Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Compile Check
        run: npm run build

      - name: ⚡ Run Vitest Unit Tests
        run: npm test

  # ==========================================
  # STAGE 2: Build & Push Docker Image
  # ==========================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Determine Environment Tag
        id: env_tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "TAG=prod" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/litmus-backend
          tags: |
            type=raw,value=${{ steps.env_tag.outputs.TAG }}
            type=raw,value=latest
            type=sha,prefix=

      - name: 🔨 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # STAGE 3A: Continuous Deployment to PRODUCTION
  # ==========================================
  deploy-prod:
    name: 🌐 Deploy to Production Server
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Trigger Production SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            echo "⚡ Deploying latest Litmus backend release to PRODUCTION..."
            cd /opt/litmus-deployment/backend
            docker pull ghcr.io/${{ github.repository }}/litmus-backend:prod
            docker compose -f docker-compose.prod.yml up -d --no-deps --build backend
            docker image prune -f
            sleep 5
            docker ps | grep litmus_backend
            echo "✅ Production deployment completed successfully!"

  # ==========================================
  # STAGE 3B: Continuous Deployment to DEVELOPMENT
  # ==========================================
  deploy-dev:
    name: 🛠️ Deploy to Development Server
    needs: build-and-push
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Trigger Development SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            echo "⚡ Deploying latest Litmus backend release to DEVELOPMENT..."
            cd /opt/litmus-dev-deployment/backend
            docker pull ghcr.io/${{ github.repository }}/litmus-backend:dev
            docker compose -f docker-compose.dev.yml up -d --no-deps --build backend
            docker image prune -f
            sleep 5
            docker ps | grep litmus_dev_backend
            echo "✅ Development deployment completed successfully!"
